[package]
name = "nakamotito-prediction"
version = "0.1.0"
edition = "2021"
description = "Nakamotito Prediction Console — observación de oracles y mercados de predicción"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "sync", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"

[profile.release]
opt-level = 3
lto = true
